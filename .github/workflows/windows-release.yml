name: Windows Release
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Check GUI gameplay
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process build/Release/complex_minesweeper.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "GUI checks failed: $($process.ExitCode)" }
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'dist'
          cmake --install build --config Release --prefix $prefix
          if ($LASTEXITCODE -ne 0) { throw 'Qt deployment failed' }
      - name: Verify standalone package
        shell: pwsh
        run: |
          if (!(Test-Path dist/plugins/platforms/qwindows.dll) -and !(Test-Path dist/platforms/qwindows.dll)) {
            throw 'Windows platform plugin missing'
          }
          # Verify the package without allowing PATH to provide the installed Qt SDK.
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot;$env:SystemRoot/System32/Wbem"
          $env:QT_QPA_PLATFORM = 'windows'
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $process = Start-Process dist/complex_minesweeper.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Standalone checks failed: $($process.ExitCode)" }
      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.md
          $name = 'complex-minesweeper-windows-x64.zip'
          Compress-Archive -Path dist/* -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: complex-minesweeper-windows-x64
          path: |
            complex-minesweeper-windows-x64.zip
            SHA256SUMS.txt
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG complex-minesweeper-windows-x64.zip SHA256SUMS.txt --verify-tag --title "扫雷 $env:RELEASE_TAG" --notes-file .github/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
